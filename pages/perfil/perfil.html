<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Usuário - Cine Horizonte</title>
    <link href="/css/home.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alkalami&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Cabeçalho -->
    <nav class="navbar bg-light">
      <div class="container-fluid">
        <a class="navbar-brand">
          <img src="/img/logo.png" alt="Logo" width="85" height="60">
          <span>Cine Horizonte</span>
        </a>
      </div>
    </nav>

    <div class="d-flex">
      <!-- Sidebar -->
      <div class="sidebar d-flex flex-column align-items-center p-3">
        <!-- mesmos botões de navegação -->
        <!-- ... (mesmos <a> e <button> que você já tem) ... -->
      </div>

      <!-- Conteúdo do Perfil -->
      <div class="flex-grow-1">
        <div class="container mt-4">
          <h2>Perfil do Usuário</h2>
          <div class="card p-4">
            <div class="row mb-3">
              <div class="col-md-6">
                <strong>Nome:</strong>
                <p id="perfil-nome">%%NOME%%</p>
                
              </div>
              <div class="col-md-6">
                <strong>E-mail:</strong>
                <p id="perfil-email">%%EMAIL%%</p>
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <strong>CPF:</strong>
                <p id="perfil-cpf">%%CPF%%</p>
              </div>
              <div class="col-md-6">
                <strong>Telefone:</strong>
                <p id="perfil-telefone">%%TELEFONE%%</p>
              </div>
            </div>
            <div class="text-end">
              <a href="/editar-perfil" class="btn btn-primary">Editar Perfil</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center mt-4">
      <p>&copy; 2025 Cine Horizonte - Todos os Direitos Reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
