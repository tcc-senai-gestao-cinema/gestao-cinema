<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Perfil - Cine Horizonte</title>
    <link href="/css/home.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Alkalami&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <nav class="navbar bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="/home">
          <img src="/img/logo.png" alt="Logo" width="85" height="60" />
          <span>Cine Horizonte</span>
        </a>
      </div>
    </nav>

    <div class="container mt-4">
      <h2>Editar Perfil</h2>
      <form action="/editar-perfil" method="POST" class="card p-4" novalidate>
  
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            class="form-control"
            value="%%NOME%%"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            id="email"
            name="e_mail"
            class="form-control"
            value="%%EMAIL%%"
            required
          />
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            class="form-control"
            value="%%TELEFONE%%"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            title="Formato esperado: (00) 00000-0000"
          />
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Nova Senha (deixe vazio para manter)</label>
          <input
            type="password"
            id="senha"
            name="senha"
            class="form-control"
            placeholder="********"
            autocomplete="new-password"
          />
        </div>

        <div class="d-flex justify-content-between">
          <a href="/perfil" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
      </form>
    </div>

    <footer class="text-center mt-4">
      <p>&copy; 2025 Cine Horizonte - Todos os Direitos Reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
